name: R CMD Check

on:
  pull_request:
    paths-ignore:
      - "*.md"
      - ".github/**"
      - ".release-please-manifest.json"
      - "release-please-config.json"
      - "codecov.yml"
      - "pkgdown/_pkgdown.yml"
      - "CITATION.cff"
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  air:
    name: air format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install
        uses: posit-dev/setup-air@v1

      - name: Check
        run: air format . --check

  jarl:
    name: jarl check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: etiennebacher/setup-jarl@v0.1.1

  R-CMD-check:
    needs: [air, jarl]
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: macos-latest, r: "release" }
          # quarto can't load the package while R CMD build renders vignettes
          # on Windows; R CMD check still re-builds them.
          - { os: windows-latest, r: "release", build-args: 'c("--no-manual", "--no-build-vignettes")' }
          - { os: ubuntu-latest, r: "devel", http-user-agent: "release" }
          - { os: ubuntu-latest, r: "release" }
          - { os: ubuntu-latest, r: "oldrel-1" }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"error"'
          upload-snapshots: true
          build_args: ${{ matrix.config.build-args || '"--no-manual"' }}
          args: 'c("--no-manual", "--as-cran")'
